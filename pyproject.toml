[project]
name = "apify-result-cache"
version = "0.5.0"
description = "Result cache for Apify Actors: serve a repeat request from your own store instead of re-scraping it. Phase 0 records request keys to measure the hit rate before anything is served."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John Cole" }]
keywords = ["apify", "actor", "cache", "pay-per-event", "supabase", "s3"]

# Same floor as apify-free-tier: the library only needs Actor.log and
# Actor.is_at_home(), which every SDK since 2.x provides. The upper bound moves
# with the fleet.
dependencies = [
    "apify>=2.7,<5",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Phase 1 (serve mode) reads and writes payload blobs over the S3 protocol.
s3 = ["boto3>=1.34"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/johnisanerd/Apify-Result-Cache"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apify_result_cache"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
